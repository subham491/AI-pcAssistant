# Hellbot settings. Only change what you need; everything has a default
# (see src/assistant/config.py for the full list). Restart the app after editing.

[brain]
# "subscription" = your Claude Pro/Max login (run `pc-assistant login` once).
# "api_key"      = uses the ANTHROPIC_API_KEY environment variable instead.
auth_mode = "subscription"
# model = "opus"            # leave unset for Claude Code's default; "sonnet" or "haiku" cost less
# effort = "medium"         # low | medium | high | xhigh | max: how hard it thinks on every turn
# resume_last_session = true

[ui]
# name = "Hellbot"                 # shown on the orb's card and tray; what the assistant calls itself
# corner = "bottom-right"          # bottom-right | bottom-left | top-right | top-left (or just drag the orb)
# monitor = 0                      # 0 = Windows primary; or 1, 2 as numbered by `pc-assistant doctor`
# trail = true                     # puffs above the orb that show each step ("reading… todo.md"); false = no puffs

[voice]
# The mic is off until you click the orb or press the talk hotkey. Click again when you are done.
# stop_on_silence = true           # false = it keeps listening until your second click, however long you pause
# end_silence_s = 2.0              # the pause that ends what you are saying (when stop_on_silence is on)
# wake_word_enabled = false        # true = also wake by voice, using one of the two options below
# wake_word_model = "hey_jarvis"   # pre-trained openWakeWord model, or a path to your .onnx
# wake_word_threshold = 0.5        # raise if it wakes by mistake, lower if it misses you
# wake_phrase = "hellbot"          # any phrase, spotted with Whisper instead of the model above (no training)
# stt_model = "auto"               # large-v3-turbo: best with accents. "small.en" is much lighter but mishears more.
#                                  # Also accepts a Hugging Face repo id / folder of a CTranslate2 Whisper model.
# language = "en"
# Words Whisper should expect: project names, jargon. Biggest accuracy win.
vocabulary = ["Claude", "Jira", "Teams", "GitHub", "VS Code"]
# tts_enabled = true
# tts_output = "JBL"               # speak through a Wi-Fi speaker (part of its name) instead of the PC; pocket engine only
# tts_tv_status_url = "http://192.168.1.7:8001/api/v2/"   # Samsung TV on that speaker: while it is on, replies
#                                  # play on the PC and the speaker drops to a third, instead of cutting the TV's sound
# tts_voice = "Zira"               # part of a Windows voice name
# tts_engine = "pocket"            # natural voice with Pocket TTS (pip install -e ".[natural-voice]"); then
#                                  # tts_voice = a built-in name like "javert", or the full path of a voice file

[hotkeys]
# pynput syntax, e.g. "<ctrl>+<alt>+<space>"
# talk = "<ctrl>+<alt>+<space>"
# stop = "<ctrl>+<alt>+q"
# toggle_overlay = "<ctrl>+<alt>+o"   # opens the box to type instead of talking

[capture]
# max_long_edge = 1280             # longest side of a screenshot in pixels; raise (up to 1568) if small text is misread
# remote_max_long_edge = 1568      # the same cap while remote mode is on (reading a remote screen needs more detail)
# main_monitor = 0                 # 0 = Windows primary; or 1, 2 as numbered by `pc-assistant doctor`
# save_screenshots = false
# redact_processes = ["KeePassXC.exe", "1Password.exe", "Bitwarden.exe"]

[safety]
# guardrails = "off"                # "on" | "no_prompts" (never asks, still blocks credentials/registry/disk tools)
#                                  # | "off" (never asks, blocks nothing: a misheard or injected instruction just runs)
# edit_mode = "review"             # "suggest" | "review" | "auto"
# bash_allow_prefixes = ["git status", "git diff", "git log", "ls", "dir"]

[remote]
# Where the project lives on your sister's laptop (for "pull her project").
remote_project_path = 'C:\Users\sister\Projects\project'
project_name = "sister-project"
