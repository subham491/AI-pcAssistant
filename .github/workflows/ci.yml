name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + test deps only; voice/GUI stacks need real hardware)
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Import check for Windows-only modules
        if: runner.os == 'Windows'
        run: python -c "import assistant.desktop.win32 as w; w.set_dpi_awareness(); print(w.foreground_window())"
